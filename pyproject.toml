[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-exit-analytics"
version = "2.0.0"
description = "Large telecom customer churn analytics case study"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.6,<4",
    "matplotlib>=3.11.2,<4",
    "scipy>=1.18.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
